# =================================================================
# Configuração Exemplo para openNDS no OpenWrt (/etc/config/opennds)
# =================================================================
# Referência de Integração FAS (Forwarding Authentication Service)
# com o portal Wi-Fi Marketing (`wifi-marketing-template`)

config opennds
    option enabled '1'
    option fwd_max_connections '100'

    # Interface da rede sem fio para visitantes (ex: br-dhcp ou br-lan)
    option gatewayinterface 'br-dhcp'

    # Nome do Gateway exibido no portal
    option gatewayname 'Loja_WiFi'

    # Duração padrão do acesso liberado (em minutos). Exemplo: 480 minutos = 8 horas
    option sessiontimeout '480'

    # -------------------------------------------------------------
    # Configurações do FAS (Forwarding Authentication Service)
    # O openNDS redireciona o cliente para o nosso servidor Next.js
    # -------------------------------------------------------------
    
    # Porta do servidor onde o Next.js está hospedado (ex: 80 para HTTP ou 443 para HTTPS)
    option fasport '80'

    # IP ou Domínio do seu servidor Next.js (Vercel, VPS ou Servidor Local)
    # Exemplo: wifi.sualoja.com.br
    option fasremoteip 'wifi.sualoja.com.br'

    # Rota da aplicação Next.js que recebe o visitante
    option faspath '/portal'

    # Nível de segurança do FAS (1 = Envia tok, clientmac, clientip, gatewayname via query string)
    option fas_secure_enabled '1'

    # Lista de domínios/IPs liberados ANTES do cadastro (Walled Garden)
    # Necessário para carregar recursos externos (CDNs, imagens do Supabase, etc.)
    list walledgarden_fqdn 'images.unsplash.com'
    list walledgarden_fqdn 'sua-instancia.supabase.co'
